# Local dev: Postgres + API. Put POSTGRES_PASSWORD, JWT_SECRET (and optionally GEMINI_API_KEY) in a root .env file.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: socialquest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: socialquest
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialquest"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+psycopg://socialquest:${POSTGRES_PASSWORD}@db:5432/socialquest
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports: ["8000:8000"]
volumes:
  pgdata:
